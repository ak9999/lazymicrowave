server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # The browser's service worker update check must always see the latest files,
    # otherwise a new deploy can be hidden behind a stale cache.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /precache-manifest.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
}
